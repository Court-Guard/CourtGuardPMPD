[project]
name = "CourtGuard"
version = "0.1.0"
description = "Advanced Policy Ingestion and Evaluation Pipeline"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "langchain>=0.2.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.0.1",
    "sentence-transformers>=2.0.0",
    "faiss-cpu>=1.7.0",
    "pdfplumber>=0.9.0",
    "llama-cloud>=1.0.0",
    "python-docx>=1.1.0",
    "pdf2image>=1.17.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.0.0",
]

[tool.black]
line-length    = 99
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Ruff — linting + import sorting (Google style)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length    = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # missing type for `self`
    "ANN102",  # missing type for `cls`
    "ANN401",  # allow Any in some cases
    "E501",    # line too long — handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["core", "infrastructure", "ingestion", "rag", "pmpd_pipeline", "debate", "bootstrap", "prompts", "evaluation", "data"]

[tool.ruff.lint.pep8-naming]
# Google style: CapWords for classes, snake_case for functions/variables
classmethod-decorators = ["classmethod"]

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version         = "3.11"
strict                 = false
warn_return_any        = true
warn_unused_ignores    = true
warn_redundant_casts   = true
disallow_untyped_defs  = true
ignore_missing_imports = true   # third-party stubs may be absent

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths    = ["CourtGuard/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "optional: marks tests as optional (deselect with '-m \"not optional\"')",
]